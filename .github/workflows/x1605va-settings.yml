name: X1605VA Settings
on:
  push:
    paths:
      - Projects/ASUS/X1605VASettings/**
      - .github/workflows/x1605va-settings.yml
  pull_request:
    paths:
      - Projects/ASUS/X1605VASettings/**
      - .github/workflows/x1605va-settings.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build preference pane
        run: bash Projects/ASUS/X1605VASettings/build.sh
      - name: Test pane and client without firmware writes
        run: bash Projects/ASUS/X1605VASettings/test.sh
      - name: Build and test the matching AsusSMC source
        run: bash Projects/ASUS/X1605VASettings/build-driver.sh
